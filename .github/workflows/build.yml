name: Build and Push Account API

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - 'app/**'
      - 'handlers/**'
      - 'models/**'
      - 'core/**'
      - 'services/**'
      - 'repositories/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coachify-account-api

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner
        id: owner
        run: |
          echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger deployment workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: '${{ github.repository_owner }}',
              repo: 'deployment',
              event_type: 'service_built',
              client_payload: {
                service: 'account-api',
                version: '${{ github.sha }}',
                image_url: '${{ env.REGISTRY }}/${{ steps.owner.outputs.owner_lower }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
              }
            })
            console.log('========================================');
            console.log('📤 Triggering Deployment Workflow');
            console.log('========================================');
            console.log('Target repository:', `${payload.owner}/${payload.repo}`);
            console.log('Event type:', payload.event_type);
            console.log('Service:', payload.client_payload.service);
            console.log('Version:', payload.client_payload.version);
            console.log('Image:', payload.client_payload.image_url);
            console.log('========================================');
            
            try {
              const response = await github.rest.repos.createDispatchEvent(payload);
              
              console.log('✅ SUCCESS: Deployment trigger sent');
              console.log('Response status:', response.status);
              console.log('');
              console.log('🎯 Next steps:');
              console.log('   1. Wait 10-30 seconds');
              console.log('   2. Check: https://github.com/${{ github.repository_owner }}/deployment/actions');
              console.log('   3. Look for "Deploy to VPS" workflow run');
              console.log('========================================');
              
            } catch (error) {
              console.error('========================================');
              console.error('❌ ERROR: Failed to trigger deployment');
              console.error('========================================');
              console.error('Error:', error.message);
              console.error('Status:', error.status);
              
              if (error.status === 404) {
                console.error('');
                console.error('Possible causes:');
                console.error('  - Repository "deployment" not found');
                console.error('  - DISPATCH_TOKEN lacks access');
                console.error('');
                console.error('Solutions:');
                console.error('  1. Verify: https://github.com/${{ github.repository_owner }}/deployment');
                console.error('  2. Check DISPATCH_TOKEN has "repo" scope');
                console.error('  3. Ensure token is added to frontend repo secrets');
              } else if (error.status === 401 || error.status === 403) {
                console.error('');
                console.error('Possible causes:');
                console.error('  - DISPATCH_TOKEN is invalid or expired');
                console.error('  - Token lacks required scopes');
                console.error('');
                console.error('Solutions:');
                console.error('  1. Create new PAT with "repo" and "workflow" scopes');
                console.error('  2. Update DISPATCH_TOKEN secret');
              }
              
              console.error('========================================');
              throw error;
            }
      - name: Build Summary
        run: |
          echo "✅ Build and Push Completed"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🏷️  Tags: latest, ${{ github.sha }}"
          echo "🚀 Deployment workflow triggered"